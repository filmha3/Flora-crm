<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>خرید واحد در سرعین | خرید آپارتمان و ویلا — Flora</title>
    <!-- Non-render-blocking font load (was a blocking @import). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <link rel="preconnect" href="https://grbtuoaoygpbtjrmxbkp.supabase.co" crossorigin />
    <script>
      // Marks public-site routes (hides the CRM splash at once); CRM routes get
      // the app title and noindex. Must match the routing in src/main.jsx.
      (function () {
        var p = location.pathname, q = location.search;
        var isPublic = !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) &&
          (p === "/" ? !/[?&](share|legal|code|error)=/.test(q) && location.hash.indexOf("access_token") < 0
                     : /^\/(properties|about|contact)(\/|$)/.test(p));
        if (isPublic) { document.documentElement.classList.add("public-route"); return; }
        // Agent CRM (/site, share links, …): app title, not indexed.
        document.title = "Flora CRM — ورود مشاوران املاک";
        document.addEventListener("DOMContentLoaded", function () {
          var r = document.querySelector('meta[name="robots"]'); if (r) r.content = "noindex";
        });
      })();
    </script>

    <!-- Makes it behave like an installed app when added to the iPhone home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flora CRM" />
    <meta name="theme-color" content="#0A0E1A" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="application-name" content="Flora CRM" />
    <meta name="description" content="خرید واحد و آپارتمان در سرعین با Flora: فایل‌های به‌روز فروش آپارتمان، ویلا و پیش‌فروش با قیمت، عکس و موقعیت روی نقشه. مشاوره و بازدید: 09300151579" />

    <!-- Canonical host: www.florapro.ir is the one Vercel actually serves
         (florapro.ir redirects to it) — this just makes explicit what's
         already true, so search engines never treat the two as separate,
         competing pages. -->
    <link rel="canonical" href="https://www.florapro.ir/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter — the practical win here isn't really search
         ranking, it's that the homepage (and, as a fallback, any link into
         the app) gets a real title/description/image instead of a blank
         card when pasted into WhatsApp, Telegram, or Twitter. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flora" />
    <meta property="og:title" content="خرید واحد در سرعین | خرید آپارتمان و ویلا — Flora" />
    <meta property="og:description" content="خرید واحد و آپارتمان در سرعین با Flora: فایل‌های به‌روز فروش آپارتمان، ویلا و پیش‌فروش با قیمت، عکس و موقعیت روی نقشه. مشاوره و بازدید: 09300151579" />
    <meta property="og:image" content="https://www.florapro.ir/icon-512.png" />
    <meta property="og:url" content="https://www.florapro.ir/" />
    <meta property="og:locale" content="fa_IR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="خرید واحد در سرعین | خرید آپارتمان و ویلا — Flora" />
    <meta name="twitter:description" content="خرید واحد و آپارتمان در سرعین با Flora: فایل‌های به‌روز فروش آپارتمان، ویلا و پیش‌فروش با قیمت، عکس و موقعیت روی نقشه. مشاوره و بازدید: 09300151579" />
    <meta name="twitter:image" content="https://www.florapro.ir/icon-512.png" />

    <!-- Organization + WebSite structured data. Deliberately NOT a
         RealEstateAgent/LocalBusiness type here — that would need a real,
         verified public address/phone/hours for the product itself, which
         isn't something to invent. Each agent's own office details live
         inside the authenticated app, not on this marketing/login page. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "@id": "https://www.florapro.ir/#agency",
      "name": "Flora",
      "description": "خرید واحد، آپارتمان و ویلا در سرعین — خرید و فروش املاک در سرعین",
      "url": "https://www.florapro.ir/",
      "telephone": "+989300151579",
      "image": "https://www.florapro.ir/icon-512.png",
      "address": { "@type": "PostalAddress", "streetAddress": "میدان دانش، جنب رستوران خاتای، سایت املاک گنجینه", "addressLocality": "سرعین", "addressRegion": "اردبیل", "addressCountry": "IR" },
      "areaServed": { "@type": "City", "name": "سرعین" }
    }
    </script>

    <style>
      @font-face {
        font-family: 'Dana';
        src: url('https://cdn.karlancer.com/assets/fonts/Dana-Pro/variable%20fonts/variable2%20webfont/DanaVF.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      html.public-route #flora-splash { display: none !important; }
      #flora-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0A0E1A;
        overflow: hidden;
      }
      /* A still, high-res PNG instead of a compressed video — crisp at any
         screen density, no re-encode softness, and lighter to load. The
         "premium" motion comes from CSS (glow, entrance, one light sweep),
         not from the asset itself. */
      #flora-splash .glow {
        position: absolute;
        width: 260px; height: 260px; border-radius: 50%;
        background: radial-gradient(circle, rgba(200,163,110,0.32) 0%, rgba(200,163,110,0) 70%);
        animation: floraGlowPulse 2.8s ease-in-out infinite;
      }
      #flora-splash .logo-wrap {
        position: relative;
        width: 132px; height: 132px;
        border-radius: 30px;
        overflow: hidden;
        animation: floraLogoIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
        filter: drop-shadow(0 10px 34px rgba(200,163,110,0.28));
      }
      #flora-splash .logo-wrap img { width: 100%; height: 100%; display: block; }
      #flora-splash .logo-wrap::after {
        content: "";
        position: absolute; top: 0; left: -160%; width: 55%; height: 100%;
        background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
        transform: skewX(-20deg);
        animation: floraShine 1.6s ease-in-out 0.55s 1;
      }
      #flora-splash .word {
        margin-top: 20px;
        font-family: 'Vazirmatn', 'Dana', sans-serif;
        font-size: 15px; font-weight: 700; letter-spacing: 3px;
        color: #C8A36E;
        opacity: 0;
        animation: floraWordIn 0.6s ease 0.5s both;
      }
      @keyframes floraGlowPulse {
        0%, 100% { opacity: 0.55; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes floraLogoIn {
        from { opacity: 0; transform: scale(0.7); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes floraShine {
        from { left: -160%; }
        to { left: 220%; }
      }
      @keyframes floraWordIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #flora-splash .glow { animation: none; opacity: 0.8; }
        #flora-splash .logo-wrap, #flora-splash .logo-wrap::after, #flora-splash .word { animation: none !important; opacity: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="flora-splash">
      <div class="glow"></div>
      <div class="logo-wrap"><img src="/icon-512.png" alt="Flora" /></div>
      <div class="word">FLORA</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
