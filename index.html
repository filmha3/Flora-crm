<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Flora CRM</title>

    <!-- Makes it behave like an installed app when added to the iPhone home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flora CRM" />
    <meta name="theme-color" content="#0A0E1A" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="application-name" content="Flora CRM" />
    <meta name="description" content="مدیریت فایل‌های ملکی، مشتریان و حساب‌کتاب دفتر املاک" />

    <style>
      @font-face {
        font-family: 'Dana';
        src: url('https://cdn.karlancer.com/assets/fonts/Dana-Pro/variable%20fonts/variable2%20webfont/DanaVF.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      #flora-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #070B18;
        overflow: hidden;
      }
      #flora-splash video {
        width: 100%; height: 100%; object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="flora-splash">
      <video id="flora-splash-video" autoplay muted playsinline webkit-playsinline="true" preload="auto">
        <source src="/splash.mp4" type="video/mp4" />
      </video>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
